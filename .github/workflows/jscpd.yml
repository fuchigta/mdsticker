name: jscpd

# コピー＆ペーストによる重複が増えていないかを確かめる。jscpd は package.json の依存に
# 入れず、npx の版指定で固定する。設定は .jscpd.json にあり、JSON にはコメントを
# 書けないので設定の根拠はここに残す。
#
# - 版: jscpd 5.4.3（Rust エンジン）。src/ の TSX・CSS、src-tauri/src/ の Rust のほか、
#   HTML・JSON・YAML・TOML・SQL も測る
# - 検出の基準: 既定値（min-tokens 50・min-lines 5・mode mild）で exact のみ。
#   .gitignore は既定で除外される（node_modules/、src-tauri/target/ など）
# - 実測（2026-11-24）: 22 ファイル・2 クローン、重複率は行 2.29%・トークン 2.60%（この jscpd.yml を含む）
#   - index.html と trashbox.html（24 行）: Vite の 2 つの入口 HTML で、読み込む
#     スクリプト以外が同じ（インラインの style を含む）
#   - src-tauri/src/lib.rs の recover_stickers と restore_stickers（18 行）:
#     付箋ウィンドウを作る WebviewWindowBuilder の呼び出し
#   - どちらも本番コード。Rust のテストは #[cfg(test)] で同じファイルにあるためパスでは
#     外せず測定に含まれるが、現状テスト由来のクローンは無い
# - threshold: 行の重複率と比べられ、超えたときだけ失敗する（2.29 では通り 2.28 では
#   落ちることを確認済み）。実測に約 0.5 ポイントの余裕を持たせて 2.8 に置くラチェットとして
#   扱い、重複を減らして実測が下がったら threshold も引き下げる
# - ignore（除外しないと 23 ファイル・3 クローン・行 1.08%・トークン 1.45%）:
#   - package-lock.json: npm の生成物のため外す。測定に入り、package.json と 26 行の
#     クローンになる。4,449 行あるため、入れたままだと重複率が薄まって低く見える
#   - src-tauri/Cargo.lock: cargo の生成物のため外す（jscpd は今は拾わないが明示的に外す）
#   - README.md・.vscode/・src-tauri/icons/・icon.drawio.png は jscpd が測らないため書かない
#   - 手元で測るときは --ignore を渡さず .jscpd.json を使う。CLI の --ignore は .jscpd.json の
#     ignore に足されるのではなく置き換えるため、数値がずれる
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jscpd:
    name: jscpd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: jscpd
        run: npx --yes jscpd@5.4.3 --no-tips --no-colors .
