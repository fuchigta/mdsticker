name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moznion/cccc-action@v1.1.2
        with:
          version: v1.8.6
          path: .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # Tauri on Linux links against GTK / WebKitGTK; the app itself ships
      # only for macOS / Windows, but these libraries let the crate (and its
      # unit tests) build on Linux. Debug builds use devUrl, so no frontend
      # build (dist/) is needed.
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        run: cargo test
